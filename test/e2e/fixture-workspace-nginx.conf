# Overrides nginxinc/nginx-unprivileged:alpine's own default.conf to serve
# from the per-user PVC mount (/workspace) instead of the baked-in,
# root-owned /usr/share/nginx/html: the fixture's podSecurityContext pins
# runAsUser 101 with no write access to that directory (Task 13a's fixture
# CRs set fsGroup: 101, which makes /workspace, not the image's own html
# dir, the one path an assertion can actually write a marker file into and
# then have nginx serve back over HTTP). Added for task-13b-brief.md
# assertion 3, which needs an HTTP-observable difference between two
# workspace pods to prove which one a routing decision actually reached --
# see this dispatch's report.
server {
    listen 8080;
    server_name localhost;

    location / {
        root /workspace;
        index index.html index.htm;
        # autoindex: a freshly-provisioned, unseeded workspace's /workspace
        # is an empty directory with no index.html, and nginx returns 403 on
        # a directory listing request by default -- breaking every existing
        # cold-start health check in this harness (checkRouterSmoke and this
        # dispatch's coldStart helper), which asserts GET / == 200. A
        # directory listing is still a 200, so this preserves that contract.
        autoindex on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
