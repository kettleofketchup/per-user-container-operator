name: release

# Publishes the operator image. cmd/main.go dispatches on the first argv
# subcommand, so the controller and the router it creates at runtime
# (RELATED_IMAGE_ROUTER) are the SAME image -- one build, one tag, never a
# second reference that could drift onto a different commit.
on:
  push:
    tags: ["v*"]
  # Lets a consumer cut an image from a branch without minting a version
  # tag for it. The tag it produces is the branch's short SHA, which is
  # never `latest` and never a version, so nothing that pins a release can
  # be silently moved by running this.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is deliberately restricted to tag builds. A consumer that
      # bundles this image for an offline install resolves the tag once, at
      # build time, and ships the bytes; a `latest` that a branch build could
      # move would put a different commit behind an already-shipped digest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
