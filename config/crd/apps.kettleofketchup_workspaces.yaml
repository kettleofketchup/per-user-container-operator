---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: workspaces.apps.kettleofketchup
spec:
  group: apps.kettleofketchup
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Workspace is the Schema for the workspaces API. It represents one
          authenticated user's container and volume for a given PerUserApp.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkspaceSpec defines the desired state of a Workspace: the app it belongs
              to and the user it belongs to.
            properties:
              appRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              userKey:
                type: string
                x-kubernetes-validations:
                - message: 'userKey is create-only: changing it re-points this workspace
                    at another user''s PVC'
                  rule: self == oldSelf
            required:
            - appRef
            - userKey
            type: object
          status:
            description: WorkspaceStatus defines the observed state of a Workspace.
            properties:
              backoffUntil:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connections:
                additionalProperties:
                  description: |-
                    ConnectionEntry is one router replica's view of live connections for a
                    Workspace, self-expiring via HeartbeatAt.

                    One entry per router replica, self-expiring. An absolute count written by two
                    replicas is last-writer-wins on a number only correct per replica: the replica
                    holding none of a user's connections would zero the one that holds them and
                    the reaper would kill a live session.
                  properties:
                    count:
                      format: int32
                      type: integer
                    heartbeatAt:
                      format: date-time
                      type: string
                  required:
                  - count
                  - heartbeatAt
                  type: object
                description: Keyed by router replica pod name.
                type: object
              consecutiveFailures:
                format: int32
                type: integer
              enqueuedAt:
                description: |-
                  FIFO ordering key for maxConcurrentStarts. creationTimestamp is
                  second-granular, so a burst of simultaneous first requests would have no
                  total order; this is written by the router with nanosecond precision on
                  the Pending write and never rewritten.
                format: date-time
                type: string
              largestObservedSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  The largest size this claim has ever been observed Bound at, written by
                  the workspace controller when it first sees the PVC Bound and thereafter
                  only raised. This is the state spec 388-391's controller-side shrink
                  refusal compares against: CEL transition rules cover a straight update,
                  but prune-and-recreate bypasses them entirely and there is nothing else
                  on the object recording what the volume actually is.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              lastActivity:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of a Workspace.
                type: string
              podRef:
                type: string
              pvcRef:
                type: string
              scaledDown:
                type: boolean
              serviceRef:
                type: string
              startDeadline:
                description: Absolute, so it survives leader failover.
                format: date-time
                type: string
              waitingReason:
                description: |-
                  Copied verbatim from the pod's waiting.reason — the only channel by which
                  an airgap ErrImageNeverPull becomes visible per user.
                type: string
              wakeRequestedAt:
                description: |-
                  Set by the router the moment a request arrives for a scaled-down
                  workspace, so a wake interleaved with a reap loses the race instead of
                  the user losing their pod.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
