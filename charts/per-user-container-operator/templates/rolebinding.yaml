{{- $root := . -}}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "puc.name" $root }}
  namespace: {{ . }}
  labels:
    {{- include "puc.controllerPodLabels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "puc.name" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "puc.name" $root }}
{{- end }}
