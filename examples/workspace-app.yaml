# The worked example: one real consumer, transcribed from its own chart.
#
# The workload is a per-user command workspace fronted over HTTP. A chat
# front end calls it as a tool server, forwarding the end user's id in a
# header; the workspace runs that user's commands and keeps their files.
#
# WHAT THIS REPLACES. The chart renders ONE Deployment of this image with
# the app's own in-container multi-user mode switched on: a single process
# maps each distinct X-User-Id to a Linux account, runs commands under
# `sudo -u`, and chmods each home 2770. Its own values file is blunt about
# what that is worth -- privacy between colleagues, not a boundary, since
# every user shares one kernel, one network namespace and one set of
# limits -- and blunter still about the failure mode: with the header
# absent the app silently falls back to the SHARED filesystem. No error,
# no log line. Zero isolation, looking perfectly healthy.
#
# It also names the fix: "if the threat model changes the answer is
# container-per-user, not this flag." That is this operator, and this CR is
# that answer. Three consequences run through everything below:
#
#   1. WORKSPACE_APP_MULTI_USER is deliberately absent. One container now
#      serves exactly one user, so the app's own account-mapping is dead
#      weight -- and its silent shared-filesystem fallback is unreachable,
#      because there is no shared filesystem left to fall back to.
#   2. The chart's root `init-home` container is gone. It existed only
#      because mounting one shared volume at /home shadowed the image's
#      baked /home/user and broke the entrypoint. Here the per-user claim
#      mounts AT /home/user and spec.storage.seed populates it from the
#      image's own skeleton, so nothing runs as root.
#   3. The shared claim becomes one claim per user, provisioned by the
#      operator with reclaimPolicy Retain.
#
# The pod spec the chart renders today is checked in verbatim at
# test/e2e/testdata/workspace-app-podspec.yaml, and
# examples/workspace_app_cr_test.go walks every field of it against this
# API. Values below that came from measurement rather than from that
# render cite docs/measurements.md.
apiVersion: apps.kettleofketchup/v1alpha1
kind: PerUserApp
metadata:
  name: workspace-app
  namespace: workspace-app
spec:
  # The header the front end forwards. Its backend populates this from the
  # authenticated session -- a browser cannot set it (docs/measurements.md
  # Step 2), which is what makes it usable as an identity at all.
  #
  # Production identities are canonical 36-character UUIDs; 64 leaves
  # headroom without accepting an unbounded header.
  identity:
    header: X-User-Id
    maxLength: 64

  # Mandatory: without it anyone who can open a socket to the router sets
  # the identity header and becomes any user. This is the same Secret the
  # chart already generates for the front end to authenticate with, so
  # adopting the operator needs no new credential.
  callerAuth:
    secretRef:
      name: workspace-app-api
      key: api-key
    header: Authorization
    scheme: Bearer

  workspace:
    image: registry.example.com/workspace-app/workspace-app:0.12.3
    imagePullPolicy: IfNotPresent
    port: 8000

    # What the router presents upstream after stripping the caller's
    # credential. The app authenticates its own callers with the same key
    # it reads from the env var below, so router and workspace share it.
    upstreamAuth:
      secretRef:
        name: workspace-app-api
        key: api-key
      header: Authorization
      scheme: Bearer

    env:
      - name: WORKSPACE_APP_API_KEY
        valueFrom:
          secretKeyRef:
            name: workspace-app-api
            key: api-key
      # WORKSPACE_APP_MULTI_USER is NOT set here, on purpose. See the
      # header: one container per user is what makes it unnecessary.

    # The chart sets no pod securityContext at all -- it leans on the
    # image's USER directive, which the operator cannot accept, because
    # runAsNonRoot with a non-numeric USER is a CreateContainerConfigError
    # for every user of the app. docs/measurements.md Step 3 read the
    # numbers off the running container (uid=1000(user) gid=1000(user)) so
    # they could be written down here, which is the only place they exist
    # as numbers.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    # Both probes, timings included, are the chart's own.
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3

    # Per POD now, where the chart's identical block was per DEPLOYMENT
    # shared by everyone. Same ceiling, applied per user instead of to the
    # sum of them: the shared container had no limits between its users at
    # all, which is half of what "privacy, not a boundary" meant.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  network:
    # Deliberately empty: a workspace runs user-supplied commands, so it
    # gets DNS and its own router and nothing else. The operator renders
    # both of those itself. Add a peer here only for something a user's
    # commands genuinely need -- and select the backing PODS, never a
    # Service ClusterIP, which NetworkPolicy never matches.
    workspaceEgress: []
    routerIngress:
      # Only the chat front end may reach the router. Not fromTraefik: no
      # end user talks to this app directly, so nothing should arrive from
      # the ingress controller.
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat-frontend

  storage:
    # TASK 15: derive from the Step 4 budget plus a growth assumption.
    # docs/measurements.md Step 3 is explicit that this CANNOT come from a
    # per-user `du`: multi-user mode has never run in production, so there
    # are no per-user homes to measure -- the one live home is the 20K
    # shared one. Whatever lands here can never be lowered afterward.
    size: 1Gi
    # Must be a Retain-reclaim class, so a reaped user's files outlive their
    # workspace; the operator refuses a Delete class outright. This is the
    # cluster's own Retain class, alongside the two Secret names above the
    # only values here that name a particular cluster rather than the
    # workload -- test/e2e/workspace_app_test.go overlays all three to run
    # this same CR against its kind cluster.
    storageClassName: ceph-block-static

    # AT /home/user, not at /home. This is the whole of what the chart's
    # root init container worked around: one claim per user needs no
    # shadowing of the image's baked home, so the entrypoint's
    # `mkdir -p "$HOME/.local/bin"` finds what it expects.
    mountPath: /home/user

    # Populate a fresh claim from the image's own home skeleton, so a new
    # user starts with the dotfiles the image ships rather than an empty
    # directory. The trailing `/.` matters: the seeder runs
    # `cp -an <from> <stagingMountPath>/`, so `/home/user` would nest the
    # skeleton one level deep at /home/user/user while `/home/user/.`
    # copies its contents.
    seed:
      # Never mountPath -- mounting the claim there would shadow the copy
      # source and every user would get an empty home.
      stagingMountPath: /mnt/home
      from: /home/user/.

  limits:
    # TASK 15: the production user table holds 8 users
    # (docs/measurements.md Step 3), which bounds this from below.
    maxWorkspaces: 50
    maxConcurrentStarts: 5

  lifecycle:
    idleTimeout: 30m
    startupTimeout: 180s
    backoffMax: 30m
    reapInterval: 60s
    connectionHeartbeatInterval: 450s

  router:
    replicas: 1
    # Measured, not guessed (docs/measurements.md Step 2). The front end
    # runs two unrelated deadlines against a tool server: fetching its
    # OpenAPI spec times out at 10 s, while invoking a tool has NO
    # client-side deadline at all. So a hold longer than 10 s buys nothing
    # for discovery -- a cold start during discovery will fail it, and the
    # front end retries -- but it is exactly what lets the first real tool
    # CALL wait out the start instead of erroring. 60 is chosen for that
    # second path; it is not an attempt to beat the 10 s one.
    coldStartHoldSeconds: 60
